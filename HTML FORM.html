    <title>HTML FORM</title>

<body>
    <h2>Create Form In HTML</h2>
    <h3>Student Regristation Form</h3>
    <form>
        <label>Full Name</label><br>
        <input type="text" name="name" placeholder="full name" required maxlength="50"><br>
        <label>Email</label><br>
        <input type="email" name="email" placeholder="Your E-mail" required maxlength="50"><br>
        <label>Password</label><br>
        <input type="password" name="password" placeholder="Your Password" required maxlength="50"><br>
        <label>Date of Birth</label><br>
        <input type="date" name="date" required><br>
        <label>Class</label><br>
        <select>
            <option>X-1</option>
            <option>X-2</option>
            <option>X-3</option>
            <option>X-4</option>
            <option>X-5</option>
            <option>X-6</option>
        </select><br>
        <label>Gender</label>
        <input type="radio" name="Gender">male
         <input type="radio" name="Gender">female <br>
        <label>Skills</label><br>
         <input type="checkbox" name="skills">HTML
          <input type="checkbox" name="skills">CSS
           <input type="checkbox" name="skills">JavaScript <br>
           <label>About Yourself</label><br>
           <textarea rows="5" cols="40" placeholder="Describe about yourself here...."required></textarea><br>
           <button type="submit">Submit</button>
           <button type="reset">Reset</button>
    </form>
